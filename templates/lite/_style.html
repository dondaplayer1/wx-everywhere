{# Plain CSS that old browsers (iOS 6/7, Android 4, IE, Opera Mini) understand. No bootstrap, no flexbox. #}
<style>
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; font-size: 16px; color: #222; background: #fff; }
  a { color: #0645ad; }
  .bar { background: #0d6efd; color: #fff; padding: 8px 10px; }
  .bar a { color: #fff; text-decoration: none; }
  .brand { font-size: 20px; font-weight: bold; margin-right: 10px; }
  .wrap { padding: 10px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  h2 { font-size: 18px; margin: 16px 0 8px; }
  input[type=text] { width: 100%; padding: 8px; font-size: 16px; border: 1px solid #999; box-sizing: border-box; -webkit-box-sizing: border-box; }
  button { padding: 8px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  th, td { text-align: left; padding: 4px; border-bottom: 1px solid #ddd; vertical-align: top; }
  .big { font-size: 40px; margin: 0; }
  .note { color: #666; font-size: 13px; }
  .alert { background: #fff3cd; border: 1px solid #e0c060; padding: 8px; margin-bottom: 10px; }
  .wx-alert { background: #f8d7da; border-color: #d9534f; }
</style>
