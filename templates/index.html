<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherEverywhere</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
  <style>
    /* clear-sky gradient: light blue under the header fading to a hazy white horizon */
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #b9dcf7 0%, #dceefc 50%, #ffffff 100%);
    }
    /* Bootstrap's gray is too faint on blue; darken it so the subtitle/footer stay readable */
    .text-body-secondary { color: #3d4f63 !important; }
  </style>
</head>
<body>
{% include "_header.html" %}

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <h1 class="h3 text-center mt-4 mb-1">Get Your Weather</h1>
        <p class="text-center text-body-secondary mb-4">Current Conditions, Hourly & Daily Forecasts, and Current Alerts</p>

        {% if error %}
        <div class="alert alert-warning" role="alert">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('get_conditions') }}" method="get" class="card card-body shadow-sm">
          <label for="q" class="form-label visually-hidden">Location</label>
          <input type="text" id="q" name="q" value="{{ q or '' }}" class="form-control form-control-lg mb-3"
                 placeholder="ex. Mount Pleasant, MI &middot; Detroit &middot; KGRR" autocomplete="off" autofocus>

          <div class="d-flex gap-2">
            <button type="submit" name="action" value="search" class="btn btn-primary flex-fill">Submit</button>
            <button type="submit" name="action" value="locate" class="btn btn-outline-secondary flex-fill order-first">Locate me!</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="container py-3 small text-body-secondary text-center">
    Weather data; OpenWeatherMap | Airport data; OurAirports
  </footer>
</body>
</html>
